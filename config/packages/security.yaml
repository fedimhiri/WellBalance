security:

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:

        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            access_denied_handler: App\Security\AccessDeniedHandler

            custom_authenticators:
                - App\Security\AppAuthenticator
                - App\Security\GoogleAuthenticator

            logout:
                path: app_logout_admin
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/Vue/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/Vue/verify-code, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/connect/google/check, roles: PUBLIC_ACCESS }

        # ✅ Autoriser /admin/nutrition/* aux nutritionnistes + admin
        - { path: ^/admin/nutrition, roles: [ROLE_ADMIN, ROLE_NUTRITIONNISTE] }

        - { path: ^/admin/type-rendez-vous, roles: ROLE_MEDECIN }
        - { path: ^/medecin/type-rendez-vous, roles: ROLE_MEDECIN }

        - { path: ^/admin/document, roles: ROLE_ADMIN }
        - { path: ^/admin/categorie, roles: ROLE_ADMIN }
        - { path: ^/admin/documents, roles: ROLE_ADMIN }
        - { path: ^/admin/categories-document, roles: ROLE_ADMIN }
        - { path: ^/admin-ea, roles: ROLE_ADMIN }

        # 🔒 règle générale admin (doit rester après la règle nutrition)
        - { path: ^/admin, roles: ROLE_ADMIN }

        - { path: ^/documents, roles: ROLE_USER }
        - { path: ^/Vue/profile, roles: ROLE_USER }


when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10